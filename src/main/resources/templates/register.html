<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="page" style="padding-top:88px">
  <div class="container">
    <div class="card auth-card">
      <div class="modal-title">Create account</div>
      <div class="modal-sub">Join RouteX for seamless travel</div>

      <form class="modal-form" th:action="@{/register}" th:object="${form}" method="post">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input class="form-input" type="text" id="name" th:field="*{name}" placeholder="John Doe" maxlength="80" required>
          <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" th:field="*{email}" placeholder="you@example.com" required>
          <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
          <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <button class="btn btn-primary btn-full" type="submit">Create Account</button>
      </form>
      <p style="margin-top:16px;text-align:center;color:var(--text2);font-size:14px">
        Already registered? <a th:href="@{/login}" style="color:var(--accent)">Sign in</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
