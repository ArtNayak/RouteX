# ============================================================
#  RouteX — Application Configuration
#  To use MySQL instead of H2, comment the H2 section and
#  uncomment the MySQL section below.
# ============================================================

spring.application.name=RouteX Bus Booking

# ---- Server ----
server.port=8080

# ---- H2 In-Memory Database (Development) ----
spring.datasource.url=jdbc:h2:mem:routexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL (Production — uncomment to use) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/routexdb?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- Data Seeding ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- Logging ----
logging.level.com.routex=DEBUG
logging.level.org.springframework.security=WARN
