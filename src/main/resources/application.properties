# ============================================================
#  RouteX — Application Configuration
#  To use MySQL instead of H2, comment the H2 section and
#  uncomment the MySQL section below.
# ============================================================

spring.application.name=RouteX Bus Booking

# ---- Server ----
server.port=8080
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# ---- Admin account (created on first start) ----
# Change this before using the app for real. Can also be set with the ROUTEX_ADMIN_PASSWORD environment variable.
routex.admin.password=${ROUTEX_ADMIN_PASSWORD:admin123}

# ---- H2 In-Memory Database (Development) ----
spring.datasource.url=jdbc:h2:mem:routexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# the H2 web console gives full database access, so it is off. Set to true for local debugging only
# (it also needs a permitAll rule for /h2-console/** in SecurityConfig).
spring.h2.console.enabled=false

# ---- MySQL (Production — uncomment to use) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/routexdb?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- Data Seeding ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- Logging ----
logging.level.com.routex=DEBUG
logging.level.org.springframework.security=WARN
